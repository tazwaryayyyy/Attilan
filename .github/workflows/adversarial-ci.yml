name: Adversarial Red-Team & Evidentiary Integrity CI

on:
  push:
    branches: [main, master, "stage-*"]
  pull_request:
    branches: [main, master, "stage-*"]

permissions:
  contents: read

jobs:
  redteam-adversarial-gate:
    name: Red-Team Constraint Enforcement (Section 16 Matrix)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opencase_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize Cryptographic Schema & Native C-Level DDL Triggers
        env:
          PGPASSWORD: postgres
          API_WORKER_PASSWORD: ci_worker_password
          AUDIT_REPLICA_PASSWORD: ci_audit_replica_password
        run: |
          psql -h localhost -p 5432 -U postgres -d opencase_test -f database/schema_stage1.sql

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Adversarial Red-Team Test Suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opencase_test
          DATABASE_URL: postgresql://api_worker_login:ci_worker_password@localhost:5432/opencase_test
          JWT_SECRET_KEY: ci_secret_key_testing_environment_only_12345
          JWT_ISSUER: attilan-test-issuer
          JWT_AUDIENCE: attilan-test-audience
          APP_PRIVATE_SIGNING_KEY: ci_signing_key_testing_environment_only_1234567890
          PYTHONPATH: .
        run: |
          pytest backend/tests/test_adversarial_redteam.py -v --tb=short

