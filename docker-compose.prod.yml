services:
  # Service 1: Core Relational, Geospatial, and Append-Only Merkle Ledger Database
  db_core:
    image: postgis/postgis:17-3.5-alpine
    container_name: opencase_db_core
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opencase_bd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_stage1.sql:/docker-entrypoint-initdb.d/01_schema_stage1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opencase_bd}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Service 2: Immutable WORM Evidence Object Storage
  minio_worm:
    image: minio/minio:latest
    container_name: opencase_minio_worm
    restart: unless-stopped
    command: server /data
    networks:
      - backend_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Service 3: WORM Lock & Compliance Retention Provisioner (Init Container)
  minio_setup:
    image: minio/mc:latest
    container_name: opencase_minio_setup
    depends_on:
      minio_worm:
        condition: service_healthy
    networks:
      - backend_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:-evidence_bucket}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio_worm:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO WORM storage layer...';
        sleep 2;
      done;
      /usr/bin/mc mb --with-lock myminio/$$MINIO_EVIDENCE_BUCKET || true;
      /usr/bin/mc retention set --default COMPLIANCE 3650d myminio/$$MINIO_EVIDENCE_BUCKET || true;
      echo 'WORM compliance object lock configured for 3650 days.';
      exit 0;
      "
    restart: "no"

  # Service 4: Section 65B Compliant Asynchronous REST API Engine
  fastapi_engine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opencase_fastapi_engine
    restart: unless-stopped
    depends_on:
      db_core:
        condition: service_healthy
      minio_setup:
        condition: service_completed_successfully
    networks:
      - backend_net
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db_core:5432/${POSTGRES_DB:-opencase_bd}
      MINIO_ENDPOINT: minio_worm:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:-evidence_bucket}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_PRIVATE_SIGNING_KEY: ${APP_PRIVATE_SIGNING_KEY}
      REMOTE_AUDIT_WEBHOOK_URL: ${REMOTE_AUDIT_WEBHOOK_URL}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Service 5: Independent External Merkle Checkpoint Daemon (RT-10 Syslog Broadcaster)
  audit_broadcaster:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opencase_audit_broadcaster
    restart: unless-stopped
    command: ["python", "-m", "backend.app.daemons.merkle_broadcaster"]
    depends_on:
      db_core:
        condition: service_healthy
    networks:
      - backend_net
      - public_net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db_core:5432/${POSTGRES_DB:-opencase_bd}
      APP_PRIVATE_SIGNING_KEY: ${APP_PRIVATE_SIGNING_KEY}
      REMOTE_AUDIT_WEBHOOK_URL: ${REMOTE_AUDIT_WEBHOOK_URL}
      BROADCAST_INTERVAL_SECONDS: "300"
      CURSOR_FILE_PATH: "/app/data/.cursor"
    volumes:
      - audit_cursor_data:/app/data

  # Service 6: Hardened Reverse Proxy & Public Security Gatekeeper
  nginx_gateway:
    image: nginx:1.27-alpine
    container_name: opencase_nginx_gateway
    restart: unless-stopped
    depends_on:
      - fastapi_engine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - public_net
      - backend_net
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/frontend/dist:ro

networks:
  backend_net:
    driver: bridge
    internal: true
  public_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  audit_cursor_data:

