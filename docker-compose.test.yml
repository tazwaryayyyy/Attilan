services:
  opencase_postgres_test:
    image: postgis/postgis:17-3.5-alpine
    container_name: opencase_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opencase_test
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema_stage1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opencase_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
