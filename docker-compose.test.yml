services:
  opencase_postgres_test:
    image: postgis/postgis:17-3.5-alpine
    container_name: opencase_postgres_test
    network_mode: bridge
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opencase_test}
      API_WORKER_PASSWORD: ${API_WORKER_PASSWORD:-ci_worker_password}
      AUDIT_REPLICA_PASSWORD: ${AUDIT_REPLICA_PASSWORD:-ci_audit_replica_password}
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema_stage1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
