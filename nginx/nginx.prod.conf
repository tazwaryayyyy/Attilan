# NGINX Production Security Gateway Configuration (BDIX Host Architecture)
# Threat Matrix Compliance: RT-02, RT-09, RT-10 Defense & Evidence Act 2022 Integrity

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with cryptographic and upstream metadata
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log production_json;

    # Core performance & security hardening
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Low-Bandwidth 3G Optimization (res gotham.md Section 6 & 7)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Exfiltration Protection (Threat RT-09 Defense)
    # Rate limit: 5 requests/min for Section 65B exports, 20 requests/min for event registration
    limit_req_zone $binary_remote_addr zone=export_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=event_create_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=120r/m;
    limit_req_status 429;

    # HTTP: Redirect all plaintext traffic to HTTPS (301)
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Enforce strict TLS 1.3 only security boundary
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;
        server_tokens off;

        # Strict TLS 1.3 Only Enforcement
        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;

        # TLS Session Parameters
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Certificate Paths
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

        # Upstream proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Evidence Export Protection (Threat RT-09: Bulk Exfiltration Defense)
        location /api/export {
            limit_req zone=export_limit burst=2 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_engine:8000;
        }

        # 2. Event Creation Rate Limiting (Threat RT-01: Lawfare Flooding Defense)
        location /api/events/create {
            limit_req zone=event_create_limit burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_engine:8000;
        }

        # 3. Backend API Gateway Reverse Proxy (Strips /api prefix)
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_engine:8000;
        }

        # 4. Frontend Single Page Application (React Static Build)
        location / {
            root /frontend/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Static assets cache control
        location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico|webp)$ {
            root /frontend/dist;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

